[package]
name = "pcbplannercad"
default-run = "pCAD"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pCAD PCB design suite"

[[bin]]
name = "pCAD"
path = "src/main.rs"

[lib]
name = "pcbplannercad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pcbplannercad-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pcbplannercad-import.workspace = true
pcbplannercad-output.workspace = true
