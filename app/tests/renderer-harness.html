<!doctype html><html><body style="margin:0"><canvas id="canvas" width="640" height="480"></canvas>
<script type="module">

const mm=n=>n*1e6,p=(x,y)=>({x:mm(x),y:mm(y)});

 const items=new Map([[1,track([1,1],[2,1],'A')],[2,track([4,1],[5,1],'B')],[3,zone]]);
 scene.update(items,{kind:'pcb',cache:{},footprints:{},view:DEFAULT_VIEW,pourFills:true});
 renderer.setScene(scene.build(theme,{selection:new Set(),hover:null}));
 renderer.setOverlay([{rank:1e6,lines:[{a:p(1,3),b:p(2,3),width:mm(.12),color:[0,1,0,1]}],fills:[]}]);

 const draw=(marked=[],hover=null)=>{const state={selection:new Set(),marked:new Set(marked),hover,dimOthers:true};renderer.setHighlights(scene.highlights(theme,state),scene.styleCount,highlightDimming(theme,state));renderer.render(cam,grid);return{marked:sample(1.5,1),other:sample(4.5,1),fill:sample(4.5,2.5),overlay:sample(1.5,3)};};
 const normal=draw(),dim=draw([1]),hover=draw([1],2),clear=draw();
 const check=(ok,message)=>{if(!ok)throw Error(message);};
 check(normal.other[0]>120,'track shader did not draw');

 check(dim.fill[0]<normal.fill[0]-10,'unmarked fill did not dim');
 check(hover.other[0]>dim.other[0]+50,'hover tint did not override dimming');
 check(clear.other.every((v,i)=>Math.abs(v-normal.other[i])<=2),'clearing net highlight left stale tint');

 renderer.resize(640,480,2);cam.panBy(20,10);cam.zoomAt(320,240,1.2);const resized=draw();
 check(resized.other[0]>120,'pan/zoom/high-DPI render failed');
 check(gl.getError()===gl.NO_ERROR,'WebGL reported an error');

 gl.bufferData=(...args)=>{uploads++;bytes+=typeof args[1]==='number'?args[1]:args[1].byteLength;return originalData(...args);};
 gl.bufferSubData=(...args)=>{uploads++;bytes+=args[2].byteLength;return originalSub(...args);};
 renderer.setScene(scene.build(theme,{selection:new Set(),hover:null}));check(uploads===0,'unchanged scene uploaded buffers');
 const context={kind:'pcb',cache:{},footprints:{},view:DEFAULT_VIEW,pourFills:true};
 // Reuse the original context references so this is an ordinary geometry edit.
 scene.update(items,context);renderer.setScene(scene.build(theme,{selection:new Set(),hover:null}));uploads=0;bytes=0;
 items.set(1,track([1,1.4],[2,1.4],'A'));scene.update(items,context);renderer.setScene(scene.build(theme,{selection:new Set(),hover:null}));
 check(uploads===1,'single-track edit uploaded unchanged fill data');
 const editBytes=bytes;renderer.setHighlights(new Map(),scene.styleCount);renderer.render(cam,grid);
 check(sample(1.5,1.4)[0]>120&&sample(1.5,1)[0]<80,'cached edit left stale track geometry');
 const retained=scene.build(theme,{selection:new Set(),hover:null});uploads=0;
 renderer.setScene([]);renderer.render(cam,grid);check(sample(1.5,1.4)[0]<80,'empty scene drew pooled geometry');
 renderer.setScene(retained);renderer.render(cam,grid);check(uploads===0&&sample(1.5,1.4)[0]>120,'restoring cached scene failed');
 const changedTheme=boardTheme(1,'all');renderer.setScene(scene.build(changedTheme,{selection:new Set(),hover:null}));renderer.render(cam,grid);
 const matches=(pixel,color)=>color.slice(0,3).every((c,i)=>Math.abs(pixel[i]-Math.round(c*255))<=2);
 check(matches(sample(1.5,1.4),changedTheme.color('L0'))&&gl.getError()===gl.NO_ERROR,'theme/rank change failed');
 items.set(4,{...track([4,1.4],[5,1.4],'C'),layer:1});scene.update(items,context);renderer.setScene(scene.build(changedTheme,{selection:new Set(),hover:null}));renderer.setHighlights(new Map(),scene.styleCount);renderer.render(cam,grid);
 check(matches(sample(4.5,1.4),changedTheme.color('L1')),'inserting a layer batch drew the wrong buffer');
 check(matches(sample(1.5,1.4),changedTheme.color('L0')),'inserting a layer damaged the retained batch');
 items.delete(4);scene.update(items,context);renderer.setScene(scene.build(changedTheme,{selection:new Set(),hover:null}));renderer.render(cam,grid);
 check(sample(4.5,1.4)[0]<80,'removing a layer left stale pooled geometry');
 items.set(3,{...zone,fill:[]});scene.update(items,context);renderer.setScene(scene.build(changedTheme,{selection:new Set(),hover:null}));renderer.render(cam,grid);
 check(sample(4.5,2.5)[0]<80&&gl.getError()===gl.NO_ERROR,'removing a fill left stale triangles');

  const data=await(await fetch('/__fixture')).json(),dense=new Scene(),entries=new Map(data.items.map(e=>[e.id,e.item]));
  const t=performance.now(),denseContext={kind:'pcb',cache:data.parts??{},footprints:data.footprints??{},view:DEFAULT_VIEW,pourFills:true};dense.update(entries,denseContext);
  cam.fit(dense.bounds());bytes=0;uploads=0;renderer.setScene(dense.build(theme,{selection:new Set(),hover:null}));const initialUploadBytes=bytes;renderer.setHighlights(new Map(),dense.styleCount);renderer.setOverlay([]);
  const cpu=[];for(let i=0;i<8;i++){cam.panBy(i%2?10:-10,0);cam.zoomAt(320,240,i%2?1/1.01:1.01);const start=performance.now();renderer.render(cam,grid);cpu.push(performance.now()-start);await new Promise(requestAnimationFrame);}
  const denseEdit=[];let editUploadBytes=0,editUploads=0;
  const id=[...entries].find(([,i])=>i.kind==='track')?.[0];
  if(id!==undefined)for(let i=0;i<8;i++){
   const old=entries.get(id);entries.set(id,{...old,a:{...old.a,x:old.a.x+1000},b:{...old.b,x:old.b.x+1000}});bytes=0;uploads=0;
   const start=performance.now();dense.update(entries,denseContext);renderer.setScene(dense.build(theme,{selection:new Set(),hover:null}));denseEdit.push(performance.now()-start);editUploadBytes=bytes;editUploads=uploads;
   renderer.render(cam,grid);await new Promise(requestAnimationFrame);
  }
  check(editUploads===1&&editUploadBytes<initialUploadBytes/10,'dense track edit repacked unaffected layers or fills');
  check(gl.getError()===gl.NO_ERROR,'dense-board WebGL error');denseEdit.sort((a,b)=>a-b);cpu.sort((a,b)=>a-b);result.dense={objects:entries.size,initialUploadBytes,editUploadBytes,editUploads,editCpuMedianMs:denseEdit[4],loadAndChecksMs:performance.now()-t,renderSubmissionMedianMs:cpu[4],note:'CPU submission only; GPU completion/presentation excluded.'};
 }
 renderer.dispose();return result;
};
</script></body></html>
