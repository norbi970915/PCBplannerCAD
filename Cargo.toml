[workspace]
resolver = "3"
members = ["crates/core", "crates/import", "crates/output", "app/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
pcbplannercad-core = { path = "crates/core" }
pcbplannercad-import = { path = "crates/import" }
pcbplannercad-output = { path = "crates/output" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2
